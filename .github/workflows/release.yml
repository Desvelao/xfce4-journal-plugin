name: Release

# Builds the plugin inside this project's own Arch-base-devel Docker image
# (see ../../Dockerfile and ../../CLAUDE.md) — not on the ubuntu-latest
# runner directly — so the shipped .so stays ABI-compatible with the
# Arch-family hosts (Arch/Manjaro) it's meant to be loaded on by end users.
# `docker` is preinstalled on GitHub-hosted runners.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the project's own test suite (Docker-only, per CLAUDE.md)
        run: ./dev.sh test

      - name: Build and stage install tree (Docker-only, per CLAUDE.md)
        run: ./dev.sh install

      - name: Package release artifact
        run: |
          tar -czf "xfce4-journal-plugin-${{ steps.vars.outputs.tag }}-x86_64.tar.gz" -C dist usr

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: xfce4-journal-plugin-${{ steps.vars.outputs.tag }}-x86_64.tar.gz
